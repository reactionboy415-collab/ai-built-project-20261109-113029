[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "json-tidy"
version = "0.1.0"
description = "A polished JSON validator and formatter CLI tool."
readme = "README.md"
requires-python = ">=3.6"
authors = [
    { name = "@reactionboy415-collab" }
]
keywords = ["json", "lint", "formatter", "cli"]

[project.scripts]
json-tidy = "json_tidy:main"